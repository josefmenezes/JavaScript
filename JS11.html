<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreetButton</title>
</head>
<body>
    <button onclick = "greet()">Click Me!</button>
    <script>
         var name = prompt("Please enter your name:");       
        function greet() {
            alert("Hello, " + name);
        }
    </script>
</body>
</html>
