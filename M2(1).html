<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <p id = "msg"></p>
    <Button onclick = Check()>Check Operators</Button>
    <script>
        function Check(){
            let num1 = Number(prompt("Enter first number"))
            let num2 = Number(prompt("Enter second number"))
            sum = num1 + num2 
            alert("Additions: " + sum)
            sub = num1 - num2 
            alert("Subtraction: " + sub)
            multi = num1 * num2 
            alert("Multiplication: " + multi)
            division = num1/num2 
            alert("Division: " + division)
            mod = num1 % num2 
            alert("Modulus " + mod)
            Exponential = num1 ** num2 
            alert("Exponential: " + Exponential)
        }
    </script>
</body>
</html>
