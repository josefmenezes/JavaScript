<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square</title>
</head>
<body>
    <script> 
        var number = prompt("Enter a number:");
        var square = number * number;
        alert("The square of " + number + " is " + square);
    </script>
    
</body>
</html>
