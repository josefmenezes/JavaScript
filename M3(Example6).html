<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForLoop</title>
</head>
<body>
    <button onclick="printNumber()">Click Me</button>
<script>
    A = parseInt(prompt("Enter a number"));
    function printNumber(){
    for(i=0; i<=10; i++){
    console.log(""+A +"x" +""+i +"=" +""+i*A);
    }
}
</script>
</body>
</html>
