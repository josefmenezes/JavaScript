<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remainder</title>
</head>
<body>
     <p id = "msg"></p>
    <Button onclick = Check()>Check Operators</Button>
    <script>
        function Check(){
            let num1 = Number(prompt("Enter first number"))
            let num2 = Number(prompt("Enter second number"))
                    
            Remain = num1%num2 
            alert("Remainder: " + Remain)
        }
    </script>
</body>
</html>
