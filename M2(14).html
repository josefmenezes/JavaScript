<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <script>
       
            let num1 = Number(prompt("Enter first number"))
            let num2 = Number(prompt("Enter second number"))
            alert("num1 is greater than Num2: " + (num1 > num2));
            alert("Num2 is greater than Num1: " + (num1 < num2));
            alert("Num1 is equal or greater than num2: " + (num1 >= num2));
            alert("Num2 is equal or greater than num1: " + (num1 <= num2));
     
    </script>
</body>
</html>
