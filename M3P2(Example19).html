<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <script>
        function Lesser()
        {
            let a = prompt("Enter first number");
            let b = prompt("Enter second number");
            if(a > b)
            {
                alert(b + " is less than " + a);
            }
            else if(b > a)
            {
                alert(a + " is less than " + b);
            }
            else
            {
                alert("Both numbers are equal");
        }
        }
        Lesser();
    </script>
</body>
