<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Button onclick=CheckTemp()>Check Temperature </Button>
    <p id="msg"></p>
    <script>

    function CheckTemp() {
        // Fixed parseFloat capitalization
        let Temp = parseFloat(prompt("Enter Current Temperature"));
        
        if (Temp >= 30) {
            document.getElementById("msg").innerHTML = "It's a hot day";
        } else {
            document.getElementById("msg").innerHTML = "It's a cool day";
        }
    }
</script>
</body>
</html>
