<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks</title>
</head>
<body>
    <script> 
        var English = prompt("Enter your English marks: ");
        var Math = prompt("Enter your Math marks: ");
        var Science = prompt("Enter your Science marks: ");
        function displayMarks(English, Math, Science) {
            alert("Your marks are:\nEnglish: " + English + "\nMath: " + Math + "\nScience: " + Science);
        }
        displayMarks(English, Math, Science);
    </script>
</body>
</html>
