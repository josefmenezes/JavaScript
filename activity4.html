<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id = "msg"> Check voting Eligibility</h1>

<button onclick = EnterResult()>Check age</button>
</button>
<script>

   function EnterResult() {
    // Just changed the capital F here
    let age = parseInt(prompt("Enter your age:")); 
    

    if (age >= 18) {
        document.getElementById("msg").innerHTML = "You are eligible to vote";
    } 
    else 
    {
         document.getElementById("msg").innerHTML = "You are not eligible to vote";
    }
    } 
    </script>
</body>
</html>
