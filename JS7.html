<!DOCTYPE html>

<head>

    <title>Subtraction</title>
</head>
<body>
    <script> 
        var a = prompt("Enter the first number:");
        var b = prompt("Enter the second number:");
        var Sub = a - b;
        alert("a - b is " + Sub);
    </script>
