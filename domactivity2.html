<button onclick = EnterResult()>Result</button>

<script>
   function EnterResult() {
    // Just changed the capital F here
    let marks = parseFloat(prompt("Enter your marks:")); 

    if (marks >= 90) {
        document.getElementById("msg").innerHTML = "Your result is A";
    } 
    else if (marks >= 80) {
        document.getElementById("msg").innerHTML = "Your result is B";
    } 
    else if (marks >= 60) {
        document.getElementById("msg").innerHTML = "Your result is C";
    } 
    else if (marks >= 35) {
        document.getElementById("msg").innerHTML = "Your result is D";
    } 
    else {
        document.getElementById("msg").innerHTML = "Your result is F";
    }
}
