<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let</title>
</head>
<body>
    <script>
        let pi = 3.14;
        let radius = prompt("Enter the radius of the circle:");
        let area = pi * radius * radius;
        alert("The area of the circle is: " + area);
    </script>
</body>
</html>
